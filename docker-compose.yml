services:
  construct:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # 6.3 GB of DA3 weights: named volume so a rebuild does not re-download them
      - hf-cache:/root/.cache/huggingface
      # scans and uploads stay readable from the host
      - ./data:/app/data
      - ./assets:/app/assets
      # The image bakes source in via COPY, so without this every backend edit needs a
      # full rebuild. Frontend changes still do (next build runs at image build time).
      - ./backend:/app/backend
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      # Python block-buffers stdout through a pipe, so route.ts sees nothing until the
      # script exits -- a 20-minute scan looks identical to a hung one without this.
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
